<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>후쿠오카 투어 2026 - 스코어보드 & 정산</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
        .tab-btn.active {
            border-bottom-color: #3b82f6;
            color: #3b82f6;
            font-weight: 700;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- 상단 헤더 -->
    <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid font-bold fa-plane-departure text-amber-400"></i>
                후쿠오카 투어 2026
            </h1>
            <span id="sync-status" class="text-xs bg-indigo-800 px-2.5 py-1 rounded-full text-indigo-200 flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse"></span> 연결 중...
            </span>
        </div>
        
        <!-- 탭 네비게이션 -->
        <div class="max-w-md mx-auto flex border-t border-indigo-800/60 bg-indigo-900/90 text-sm">
            <button onclick="switchTab('score')" id="tab-score" class="tab-btn active flex-1 py-3 text-center border-b-2 border-transparent hover:text-white transition">
                <i class="fa-solid font-bold fa-trophy mr-1"></i> 스코어보드
            </button>
            <button onclick="switchTab('settlement')" id="tab-settlement" class="tab-btn flex-1 py-3 text-center border-b-2 border-transparent text-indigo-200 hover:text-white transition">
                <i class="fa-solid font-bold fa-calculator mr-1"></i> 정산하기
            </button>
        </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="max-w-md mx-auto px-4 mt-4">

        <!-- 1. 스코어보드 탭 -->
        <section id="section-score" class="space-y-4">
            <!-- 리더보드 카드 -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-bold text-slate-800 text-lg flex items-center gap-1.5">
                        <i class="fa-solid font-bold fa-ranking-star text-amber-500"></i> 실시간 순위
                    </h2>
                    <button onclick="resetScores()" class="text-xs text-slate-400 hover:text-red-500 transition">
                        <i class="fa-solid font-bold fa-rotate-right"></i> 점수 초기화
                    </button>
                </div>

                <!-- 멤버별 점수 리스트 -->
                <div id="score-list" class="space-y-2">
                    <!-- JS로 동적 생성됨 -->
                </div>
            </div>
        </section>

        <!-- 2. 정산하기 탭 -->
        <section id="section-settlement" class="space-y-4 hidden">
            <!-- 지출 등록 폼 -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
                <h2 class="font-bold text-slate-800 text-lg flex items-center gap-1.5">
                    <i class="fa-solid font-bold fa-receipt text-indigo-600"></i> 지출 내역 추가
                </h2>
                
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">내용 / 항목</label>
                    <input type="text" id="expense-title" placeholder="예: 텐진 야타이 저녁" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">결제 금액 (￥ / ₩)</label>
                        <input type="number" id="expense-amount" placeholder="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">결제한 사람</label>
                        <select id="expense-payer" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <!-- JS로 동적 생성됨 -->
                        </select>
                    </div>
                </div>

                <button onclick="addExpense()" class="w-full bg-indigo-600 text-white font-semibold py-2.5 rounded-xl shadow hover:bg-indigo-700 transition text-sm flex items-center justify-center gap-1.5">
                    <i class="fa-solid font-bold fa-plus"></i> 지출 추가하기
                </button>
            </div>

            <!-- 정산 요약 카드 -->
            <div class="bg-indigo-50 rounded-2xl p-4 border border-indigo-100 space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-indigo-950 text-sm">총 지출 금액</h3>
                    <span id="total-expense-display" class="font-extrabold text-indigo-600 text-lg">0원</span>
                </div>
                <div id="settlement-summary-list" class="space-y-1.5 text-xs border-t border-indigo-100 pt-3">
                    <!-- 정산 결과 동적 생성 -->
                </div>
            </div>

            <!-- 지출 내역 리스트 -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
                <h3 class="font-bold text-slate-800 text-sm">지출 상세 기록</h3>
                <div id="expense-history-list" class="space-y-2 text-sm">
                    <!-- 지출 내역 동적 생성 -->
                </div>
            </div>
        </section>

    </main>

    <!-- Firebase Realtime Database SDK 및 스크립트 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, update, push, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 1. Firebase 설정 (제공받은 키 적용)
        const firebaseConfig = {
            apiKey: "AIzaSyD1H2dViopwFAiHIWAJPzI7s0SqBDAGels",
            authDomain: "hukuoka-tour2026.firebaseapp.com",
            databaseURL: "https://hukuoka-tour2026-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "hukuoka-tour2026",
            storageBucket: "hukuoka-tour2026.firebasestorage.app",
            messagingSenderId: "182409782645",
            appId: "1:182409782645:web:b59615e9dee3f35f915f3c"
        };

        // 2. Firebase 초기화
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 초기 멤버 목록
        const DEFAULT_MEMBERS = ["원석", "종희", "선우", "영규", "지윤", "호준", "동민", "현주"];

        // 앱 상태 데이터
        let state = {
            scores: {},
            expenses: {}
        };

        // Realtime DB 참조 경로
        const scoresRef = ref(db, 'fukuoka2026/scores');
        const expensesRef = ref(db, 'fukuoka2026/expenses');

        // DB 실시간 데이터 수신 (Scores)
        onValue(scoresRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                state.scores = data;
            } else {
                // 초기값이 없을 경우 기본 멤버 등록
                const initScores = {};
                DEFAULT_MEMBERS.forEach(m => initScores[m] = 0);
                set(scoresRef, initScores);
                state.scores = initScores;
            }
            updateSyncStatus(true);
            renderScores();
            renderPayerOptions();
            renderSettlement();
        }, (error) => {
            console.error("Firebase Scores Read Error:", error);
            updateSyncStatus(false);
        });

        // DB 실시간 데이터 수신 (Expenses)
        onValue(expensesRef, (snapshot) => {
            state.expenses = snapshot.val() || {};
            renderExpenseHistory();
            renderSettlement();
        });

        // 동기화 상태 표시
        function updateSyncStatus(isOnline) {
            const el = document.getElementById('sync-status');
            if (isOnline) {
                el.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> 실시간 연결됨`;
                el.className = "text-xs bg-indigo-800 px-2.5 py-1 rounded-full text-indigo-200 flex items-center gap-1";
            } else {
                el.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-400"></span> 오프라인`;
                el.className = "text-xs bg-red-900/50 px-2.5 py-1 rounded-full text-red-200 flex items-center gap-1";
            }
        }

        // 스코어보드 렌더링
        function renderScores() {
            const listEl = document.getElementById('score-list');
            listEl.innerHTML = '';

            // 점수순 정렬
            const sorted = Object.entries(state.scores).sort((a, b) => b[1] - a[1]);

            sorted.forEach(([name, score], idx) => {
                let badgeClass = "bg-slate-100 text-slate-600";
                if (idx === 0) badgeClass = "bg-amber-100 text-amber-700 font-bold";
                else if (idx === 1) badgeClass = "bg-slate-200 text-slate-700 font-bold";
                else if (idx === 2) badgeClass = "bg-orange-100 text-orange-700 font-bold";

                const card = document.createElement('div');
                card.className = "flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-100";
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-6 h-6 rounded-full ${badgeClass} text-xs flex items-center justify-center">${idx + 1}</span>
                        <span class="font-semibold text-slate-700">${name}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="changeScore('${name}', -1)" class="w-8 h-8 rounded-lg bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 flex items-center justify-center active:scale-95 transition">-</button>
                        <span class="font-extrabold text-indigo-600 w-8 text-center">${score}</span>
                        <button onclick="changeScore('${name}', 1)" class="w-8 h-8 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 flex items-center justify-center active:scale-95 transition">+</button>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        // 점수 변경 처리
        window.changeScore = function(name, delta) {
            const currentScore = state.scores[name] || 0;
            const newScore = Math.max(0, currentScore + delta);
            
            const updates = {};
            updates[`fukuoka2026/scores/${name}`] = newScore;
            update(ref(db), updates);
        };

        // 점수 전체 초기화
        window.resetScores = function() {
            if (confirm("모든 멤버의 점수를 0점으로 초기화하시겠습니까?")) {
                const resetData = {};
                Object.keys(state.scores).forEach(name => resetData[name] = 0);
                set(scoresRef, resetData);
            }
        };

        // 결제자 선택 셀렉트 박스 옵션 생성
        function renderPayerOptions() {
            const selectEl = document.getElementById('expense-payer');
            selectEl.innerHTML = '';
            Object.keys(state.scores).forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                selectEl.appendChild(opt);
            });
        }

        // 지출 추가 처리
        window.addExpense = function() {
            const titleEl = document.getElementById('expense-title');
            const amountEl = document.getElementById('expense-amount');
            const payerEl = document.getElementById('expense-payer');

            const title = titleEl.value.trim();
            const amount = parseInt(amountEl.value, 10);
            const payer = payerEl.value;

            if (!title || isNaN(amount) || amount <= 0) {
                alert("올바른 항목 이름과 금액을 입력해주세요.");
                return;
            }

            const newExpenseRef = push(expensesRef);
            set(newExpenseRef, {
                title: title,
                amount: amount,
                payer: payer,
                timestamp: Date.now()
            }).then(() => {
                titleEl.value = '';
                amountEl.value = '';
            });
        };

        // 지출 삭제 처리
        window.deleteExpense = function(key) {
            if (confirm("이 지출 내역을 삭제하시겠습니까?")) {
                remove(ref(db, `fukuoka2026/expenses/${key}`));
            }
        };

        // 지출 내역 리스트 렌더링
        function renderExpenseHistory() {
            const historyEl = document.getElementById('expense-history-list');
            historyEl.innerHTML = '';

            const entries = Object.entries(state.expenses);
            if (entries.length === 0) {
                historyEl.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">등록된 지출 내역이 없습니다.</p>`;
                return;
            }

            // 최신순 정렬
            entries.sort((a, b) => b[1].timestamp - a[1].timestamp).forEach(([key, exp]) => {
                const item = document.createElement('div');
                item.className = "flex justify-between items-center p-2.5 bg-slate-50 rounded-xl text-xs";
                item.innerHTML = `
                    <div>
                        <div class="font-semibold text-slate-700">${exp.title}</div>
                        <div class="text-slate-400 text-[10px]">결제자: <span class="font-medium text-slate-600">${exp.payer}</span></div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-slate-800">${exp.amount.toLocaleString()}</span>
                        <button onclick="deleteExpense('${key}')" class="text-slate-300 hover:text-red-500 transition p-1">
                            <i class="fa-solid font-bold fa-xmark"></i>
                        </button>
                    </div>
                `;
                historyEl.appendChild(item);
            });
        }

        // 정산 금액 계산 및 렌더링
        function renderSettlement() {
            const totalDisplay = document.getElementById('total-expense-display');
            const summaryList = document.getElementById('settlement-summary-list');

            const members = Object.keys(state.scores);
            const memberCount = members.length;

            if (memberCount === 0) return;

            let totalExpense = 0;
            const paidMap = {};
            members.forEach(m => paidMap[m] = 0);

            // 각자 결제한 총액 계산
            Object.values(state.expenses).forEach(exp => {
                totalExpense += exp.amount;
                if (paidMap[exp.payer] !== undefined) {
                    paidMap[exp.payer] += exp.amount;
                }
            });

            totalDisplay.textContent = `${totalExpense.toLocaleString()} 원/엔`;

            // N빵 금액 (1인당 부담금)
            const perPerson = Math.floor(totalExpense / memberCount);

            summaryList.innerHTML = `<div class="text-[11px] text-indigo-400 mb-2">1인당 부담금: <span class="font-bold text-indigo-700">${perPerson.toLocaleString()}</span></div>`;

            // 각 멤버별 주고받을 금액 계산
            members.forEach(name => {
                const paid = paidMap[name] || 0;
                const diff = paid - perPerson; // +면 받아야함, -면 보내야함

                const row = document.createElement('div');
                row.className = "flex justify-between items-center py-1 border-b border-indigo-100/50 last:border-0";

                if (diff > 0) {
                    row.innerHTML = `<span>${name}</span> <span class="text-emerald-600 font-bold">+${diff.toLocaleString()} (받기)</span>`;
                } else if (diff < 0) {
                    row.innerHTML = `<span>${name}</span> <span class="text-rose-500 font-bold">${diff.toLocaleString()} (보내기)</span>`;
                } else {
                    row.innerHTML = `<span>${name}</span> <span class="text-slate-400">0 (정산 완료)</span>`;
                }
                summaryList.appendChild(row);
            });
        }

        // 탭 전환 함수
        window.switchTab = function(tabName) {
            const scoreSec = document.getElementById('section-score');
            const settlementSec = document.getElementById('section-settlement');
            const tabScoreBtn = document.getElementById('tab-score');
            const tabSettlementBtn = document.getElementById('tab-settlement');

            if (tabName === 'score') {
                scoreSec.classList.remove('hidden');
                settlementSec.classList.add('hidden');
                tabScoreBtn.classList.add('active');
                tabSettlementBtn.classList.remove('active');
            } else {
                scoreSec.classList.add('hidden');
                settlementSec.classList.remove('hidden');
                tabScoreBtn.classList.remove('active');
                tabSettlementBtn.classList.add('active');
            }
        };
    </script>
</body>
</html>
